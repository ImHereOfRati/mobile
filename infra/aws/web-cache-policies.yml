AWSTemplateFormatVersion: "2010-09-09"
Description: ImHere immutable React release and uncached API CloudFront policies.

Resources:
  ImmutableReleaseCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Cache commit-addressed React releases for one year.
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 31536000
        Name: imhere-release-immutable-v1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ApiNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Never cache authenticated API responses.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        Name: imhere-api-no-cache-v1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          # TTL이 전부 0이라 캐싱이 꺼진 정책이다. 이 상태에서 CloudFront는
          # EnableAcceptEncoding*을 켜는 걸 거부한다:
          #   "The parameter EnableAcceptEncodingGzip is invalid for policy
          #    with caching disabled."
          # 그렇다고 키를 빼면 CFN 스키마가 필수라며 막는다:
          #   "required key [EnableAcceptEncodingGzip] not found"
          # 그래서 키는 두되 false로 명시한다. 압축은 오리진과 뷰어가 협상한다.
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Comment: Forward viewer authorization, cookies, and query strings to API.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - Host
        Name: imhere-api-auth-query-v1
        QueryStringsConfig:
          QueryStringBehavior: all

Outputs:
  ApiCachePolicyId:
    Description: Set GitHub variable API_CACHE_POLICY_ID to this value.
    Value: !Ref ApiNoCachePolicy
  ApiOriginRequestPolicyId:
    Description: Set GitHub variable API_ORIGIN_REQUEST_POLICY_ID to this value.
    Value: !Ref ApiOriginRequestPolicy
  ReleaseCachePolicyId:
    Description: Set GitHub variable RELEASE_CACHE_POLICY_ID to this value.
    Value: !Ref ImmutableReleaseCachePolicy
