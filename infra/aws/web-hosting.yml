AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ImHere static hosting. One private S3 bucket behind one CloudFront
  distribution serving the landing page, the React web app and the design site.
  Deploy this stack in us-east-1 (CloudFront certificates must live there).

Parameters:
  BucketName:
    Type: String
    Description: Globally unique name of the private content bucket.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN (us-east-1) covering both domains below.
  LandingDomain:
    Type: String
    Default: imhere.ratiko.co.kr
    Description: Serves landing/ at / and the web app at /app/.
  DesignDomain:
    Type: String
    Default: imhere-design.ratiko.co.kr
    Description: Serves design/ at /.
  ApiOriginDomain:
    Type: String
    Default: imhere-server.ratiko.co.kr
    Description: Backend host that /api/*, /swagger-ui/* and /docs/* are proxied to (HTTPS).
  AttachAliases:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false for the first deploy while the old distributions still own the
      domain names, then move the aliases (see README) and update to true.
  GitHubRepository:
    Type: String
    Default: ImHereOfRati/mobile
    Description: owner/repo allowed to assume the deploy role.
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider.

Conditions:
  UseAliases: !Equals [!Ref AttachAliases, "true"]

Resources:
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-static-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Maps host + path onto the bucket prefixes and gives the React app its SPA
  # fallback:
  #   imhere-design.<domain>/*  -> design/*
  #   imhere.<domain>/app/*     -> app/*   (unknown paths -> app/index.html)
  # /api/*, /swagger-ui/*, /docs/* never reach this function (API behaviors).
  #   imhere.<domain>/*         -> landing/*
  RoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-routing"
      AutoPublish: true
      FunctionConfig:
        Comment: Route hosts and paths to bucket prefixes.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : "";
          var uri = request.uri;
          var isDesign = host === "${DesignDomain}";
          var isApp = !isDesign && (uri === "/app" || uri.indexOf("/app/") === 0);

          if (isApp) {
            var last = uri.substring(uri.lastIndexOf("/") + 1);
            request.uri = last.indexOf(".") === -1 ? "/app/index.html" : uri;
            return request;
          }

          var prefix = isDesign ? "/design" : "/landing";
          if (uri.charAt(uri.length - 1) === "/") uri += "index.html";
          request.uri = prefix + uri;
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} static hosting"
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Aliases: !If
          - UseAliases
          - [!Ref LandingDomain, !Ref DesignDomain]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - UseAliases
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: content
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Ref ApiOriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        CacheBehaviors:
          # Managed-CachingDisabled + Managed-AllViewerExceptHostHeader: forwards
          # cookies, auth headers and query strings, never caches.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: false
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /swagger-ui/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /docs/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        DefaultCacheBehavior:
          TargetOriginId: content
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          # Managed-CachingOptimized: honours origin Cache-Control (min TTL 1s).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RoutingFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ContentBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:production"
      Policies:
        - PolicyName: deploy-static-content
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ContentBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${ContentBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionId:
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Gabia CNAME target for both domains.
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Description: GitHub variable WEB_BUCKET
    Value: !Ref ContentBucket
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
