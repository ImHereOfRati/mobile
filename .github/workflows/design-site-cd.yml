name: Design Site CD

on:
  push:
    branches:
      - main
    paths:
      - "design_site/**"
      - "app/lib/components/**"
      - "app/assets/**"
      - "app/pubspec.yaml"
      - ".github/workflows/design-site-cd.yml"
  workflow_dispatch:

concurrency:
  group: deploy-design-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: 디자인 사이트 배포
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Prepare app package
        run: cp app/tool/ci/iam_here_flutter_secret.env.example app/iam_here_flutter_secret.env

      - name: Install dependencies
        working-directory: design_site
        run: flutter pub get

      - name: Test
        working-directory: design_site
        run: flutter test

      - name: Build web
        working-directory: design_site
        run: flutter build web --release --base-href /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imhere-design-${{ github.run_id }}

      - name: Upload to S3
        run: |
          aws s3 sync design_site/build/web "s3://${{ vars.WEB_BUCKET }}/design/" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Record deployment
        run: |
          {
            echo "## Design site deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: https://imhere-design.ratiko.co.kr/"
          } >> "$GITHUB_STEP_SUMMARY"
