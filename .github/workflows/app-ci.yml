name: App CI

on:
  push:
    branches:
      - main
    paths:
      - "app/lib/**"
      - "app/test/**"
      - "app/android/**"
      - "app/ios/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/analysis_options.yaml"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/lib/**"
      - "app/test/**"
      - "app/android/**"
      - "app/ios/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/analysis_options.yaml"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: 앱 분석 및 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare CI configuration
        run: |
          cp tool/ci/firebase_options.dart lib/firebase_options.dart
          cp tool/ci/iam_here_flutter_secret.env.example iam_here_flutter_secret.env

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
