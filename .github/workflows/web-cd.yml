name: Web CD

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-cd.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: 웹 앱 배포
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        env:
          VITE_APP_BASE_PATH: /app/
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imhere-web-${{ github.run_id }}

      # Hashed assets first (kept, never deleted here) so a new index.html never
      # points at a missing file; everything else revalidates on every request.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/app/assets "s3://${{ vars.WEB_BUCKET }}/app/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Upload app shell
        run: |
          aws s3 sync dist/app "s3://${{ vars.WEB_BUCKET }}/app/" \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Record deployment
        run: |
          {
            echo "## Web deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: https://imhere.ratiko.co.kr/app/"
          } >> "$GITHUB_STEP_SUMMARY"
