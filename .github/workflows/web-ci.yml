name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/rollback-web.yml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/rollback-web.yml"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check generated bridge contract
        run: pnpm bridge:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build immutable release candidate
        env:
          RELEASE_SHA: "0000000000000000000000000000000000000000"
          VITE_APP_BASE_PATH: /app/releases/0000000000000000000000000000000000000000/
        run: pnpm build:app && node scripts/check-release-build.mjs

      - name: Build
        run: pnpm build
