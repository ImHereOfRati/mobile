name: imhere_landing_page
description: ImHere 공식 랜딩 페이지
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  iamhere:
    path: ../app
  flutter_svg: ^2.2.3
  dio: ^5.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app-logo.svg
  fonts:
    - family: ImHereLogo
      fonts:
        - asset: assets/fonts/Jalnan2.otf
    # Gmarket Sans Bold reduced to the hero headline glyphs (+ ASCII). Re-subset
    # from the full font if the headline copy changes.
    - family: GmarketSansHeadline
      fonts:
        - asset: assets/fonts/GmarketSansHeadline.ttf
